name: copy-lint
description: Check website and app copy against your style guide, with the model of your choice.
author: Firedance
branding: { icon: edit-3, color: purple }
inputs:
  paths:
    description: Files or globs to lint (space-separated). Defaults to the config's include list.
    default: ''
  config:
    description: Path to copy-lint.json
    default: copy-lint.json
  provider:
    description: anthropic | openai | ollama | openai-compatible | none. Default picks from the keys you pass in env.
    default: ''
  model:
    description: Model name. Default for anthropic is claude-opus-5-5; required for other providers.
    default: ''
  rules-only:
    description: Skip the model review
    default: 'false'
  max-warnings:
    description: Fail when there are more warnings than this
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 22 }
    - shell: bash
      run: npm ci --omit=dev --prefix "${{ github.action_path }}" --silent
    - shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_RULES_ONLY: ${{ inputs.rules-only }}
        INPUT_MAX_WARNINGS: ${{ inputs.max-warnings }}
      run: |
        args=(-c "$INPUT_CONFIG" -f github)
        [ -n "$INPUT_PROVIDER" ] && args+=(--provider "$INPUT_PROVIDER")
        [ -n "$INPUT_MODEL" ] && args+=(--model "$INPUT_MODEL")
        [ "$INPUT_RULES_ONLY" = "true" ] && args+=(--rules-only)
        [ -n "$INPUT_MAX_WARNINGS" ] && args+=(--max-warnings "$INPUT_MAX_WARNINGS")
        # shellcheck disable=SC2086
        node "${{ github.action_path }}/bin/copy-lint.mjs" "${args[@]}" $INPUT_PATHS
